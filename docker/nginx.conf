# Tranca da entrada direta (*.up.railway.app): exige X-Inspetor-Chave
# Se o Host terminar em .up.railway.app e X-Inspetor-Chave for diferente da chave secreta -> 403
map $host $is_railway_direct {
    default 0;
    "~*\\.up\\.railway\\.app$" 1;
}

map $http_x_inspetor_chave $is_inspetor_authorized {
    default 0;
    "__INSPETOR_CHAVE__" 1;
}

map "$is_railway_direct:$is_inspetor_authorized" $bloquear_entrada_direta {
    default 0;
    "1:0" 1;
}

# Tranca de origem (carimbo da Cloudflare X-Origem-Chave) (fase 2 - 147)
# Isentos: healthcheck do Railway e endereço direto (já coberto por is_railway_direct)
map $host $is_origem_isento {
    default $is_railway_direct;
    "healthcheck.railway.app" 1;
}

map $http_x_origem_chave $origem_ok {
    default 0;
    "__ORIGEM_CHAVE__" 1;
}

map "__ORIGEM_ATIVA__:$is_origem_isento:$origem_ok" $bloquear_origem {
    default 0;
    "1:0:0" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 6G;

    # Bloqueio do endereço direto sem chave válida
    if ($bloquear_entrada_direta = 1) {
        return 403;
    }

    # Bloqueio de origem sem carimbo da Cloudflare (fase 2 - 147)
    if ($bloquear_origem = 1) {
        return 403;
    }

    # Increase header buffer size
    large_client_header_buffers 4 32k;

    # Increase the maximum allowed size of the client request body
    client_body_buffer_size 32k;

    # Increase the maximum allowed size of the client request header fields
    client_header_buffer_size 32k;

    # Collab server (WebSocket)
    location /collab {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # NextJS Revalidation
    location /api/revalidate {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next Auth
    location /api/auth {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Backend API
    location /api/v1 {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts to allow large uploads (e.g. SCORM packages up to 5GB)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend Static Content
    location /content {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Docs (only available in development mode)
    location /api/v1/docs {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI ReDoc (only available in development mode)
    location /api/v1/redoc {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend 
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}